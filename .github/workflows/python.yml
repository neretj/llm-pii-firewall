name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: pii-firewall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,presidio,langdetect,web]"
      - run: python -m spacy download en_core_web_sm
      - name: Run deterministic and English Presidio tests
        run: python -m pytest tests_integration --ignore=tests_integration/languages -m "not slow" -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-firewall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U build twine
      - run: python -m build
      - run: python -m twine check dist/*
